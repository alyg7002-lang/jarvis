<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>J.A.R.V.I.S.</title>
  <meta name="description" content="Elijah's personal assistant: schedule, due dates, Bible study, build mode, screen time and trading practice, by voice.">
  <meta name="theme-color" content="#060e17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Chakra+Petch:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="app" id="app">
    <nav class="rail" aria-label="Sections">
      <a class="rail-mark" href="#home" aria-label="Jarvis home"><span class="mark"></span></a>
      <div class="rail-links" id="railLinks"></div>
      <div class="rail-foot"><span class="dot" id="railDot"></span></div>
    </nav>

    <header class="top">
      <div class="top-time"><span id="clock">--:--</span><span id="dayline"></span></div>
      <button class="status" id="status" type="button" data-act="goto" data-view="settings"><span class="dot"></span><span id="statusText">Starting up</span></button>
    </header>

    <div class="banner" id="banner" hidden></div>

    <main id="main" tabindex="-1">
      <section class="view view-home" id="view-home" data-title="Home">
        <div class="console">
          <div class="orb-wrap">
            <canvas class="orb" id="orb" role="button" tabindex="0" aria-label="Talk to Jarvis"></canvas>
            <p class="orb-state" id="orbState" aria-live="polite">Tap the reactor to talk</p>
          </div>
          <div class="convo" id="convo" aria-live="polite"></div>
          <div class="suggest" id="suggest"></div>
          <form class="composer" id="composer" autocomplete="off">
            <label class="sr" for="typed">Message Jarvis</label>
            <input id="typed" placeholder="Ask Jarvis anything" enterkeyhint="send">
            <button type="button" class="deep" id="deepBtn" aria-pressed="false" title="Use the bigger model for this message">Deep</button>
            <button type="button" class="mic" id="micBtn" aria-label="Talk"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
          </form>
        </div>
        <aside class="today" id="todayPanel" aria-label="Today"></aside>
      </section>

      <section class="view" id="view-faith" data-title="Faith" hidden></section>
      <section class="view" id="view-build" data-title="Build" hidden></section>
      <section class="view" id="view-focus" data-title="Focus" hidden></section>
      <section class="view" id="view-trading" data-title="Trading" hidden></section>
      <section class="view" id="view-learn" data-title="Learn" hidden></section>
      <section class="view" id="view-review" data-title="Review" hidden></section>
      <section class="view" id="view-settings" data-title="Settings" hidden></section>
      <section class="view" id="view-more" data-title="More" hidden></section>
    </main>

    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  </div>

  <div class="session" id="session" hidden role="dialog" aria-modal="true" aria-labelledby="sessionTask">
    <div class="session-inner">
      <p class="session-kicker">Build session</p>
      <h2 class="session-task" id="sessionTask"></h2>
      <div class="session-clock" id="sessionClock">25:00</div>
      <div class="session-bar"><i id="sessionBar"></i></div>
      <div class="session-actions">
        <button class="btn primary" data-act="session-finish">Finished it</button>
        <button class="btn" data-act="session-pause" id="sessionPause">Pause</button>
        <button class="btn quiet" data-act="session-cancel">Stop session</button>
      </div>
      <p class="session-note">Your phone stays across the room until this hits zero.</p>
    </div>
  </div>

  <div class="caption" id="caption" hidden>
    <p class="caption-text" id="captionText" aria-live="polite"></p>
    <form class="caption-form" id="captionForm" autocomplete="off">
      <label class="sr" for="captionIn">Answer Jarvis</label>
      <input id="captionIn" placeholder="Type your answer">
      <button type="button" class="mic" id="captionMic" aria-label="Answer by voice"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <button type="button" class="btn quiet small" id="captionClose" aria-label="Hide">Hide</button>
    </form>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script type="module" src="assets/app.js"></script>
</body>
</html>
