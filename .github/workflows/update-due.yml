name: Update due dates

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch D2L calendar
        env:
          D2L_ICS_URL: ${{ secrets.D2L_ICS_URL }}
        run: python data/fetch_due.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- due.json; then
            echo "Nothing new."
          else
            git config user.name "jarvis-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add due.json
            git commit -m "Update due dates"
            git push
          fi
